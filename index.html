<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Plan">
<meta name="theme-color" content="#FFFDF7">
<title>Game Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone app. Home = four section tiles; Jacob's section has a bottom tab bar; other sections are page lists with a back bar. Ink-on-cream to match the paper book. */
:root{
  --bg:#FFFDF7; --card:#FFFFFF; --ink:#1E2A38; --muted:#5B6573; --line:#1E2A38;
  --teal:#127A7A; --teal-soft:#E3F2F1; --coin:#F2B632; --coin-soft:#FFF4D1; --orange:#C2561A; --orange-soft:#FBE9DD;
  --plum:#5B4B8A; --plum-soft:#ECE8F6; --on-accent:#FFFFFF;
  --l1:#3E9B5B; --l2:#9BBF3B; --l3:#F2B632; --l4:#E57B2E; --l5:#C8382B;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:Nunito,'Segoe UI',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141B24; --card:#1C2531; --ink:#F2EEE3; --muted:#A9B2BE; --line:#3A4757;
  --teal:#4FC1BC; --teal-soft:#183533; --coin-soft:#3A3019; --orange:#F0915A; --orange-soft:#3A2519;
  --plum:#B3A3E6; --plum-soft:#2A2440; --on-accent:#0E1A1A; color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:3px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.htitle{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.back{border:0;background:transparent;padding:0;font-weight:800;color:var(--teal);font-size:14px;text-align:left}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.08;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:21px;text-wrap:balance}
h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.wallet{display:flex;gap:6px;flex:none}
.coin{min-width:64px;text-align:center;border:2px solid var(--line);border-radius:12px;padding:3px 8px;background:var(--coin-soft)}
.coin b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.coin span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.coin.saved{background:var(--teal-soft)}
main{flex:1;padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
main.nonav{padding-bottom:40px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.list{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1.5px solid var(--line);min-height:56px}
.item:last-child{border-bottom:0}
.item .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.pill{font-weight:800;font-variant-numeric:tabular-nums;border:2px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--coin-soft);white-space:nowrap;font-size:14px}
.btn{border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;background:var(--card);text-align:center}
.btn.primary{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.btn.coinbtn{background:var(--coin);color:#1E2A38}
.btn.ghost{border-style:dashed;background:transparent}
.btn.small{padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.plus{width:56px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--coin);font-family:var(--display);font-weight:800;font-size:18px;color:#1E2A38;flex:none}
.empty{border:2px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);text-align:center}
.note{font-size:14px;color:var(--muted)}
.card{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card)}
.confirm{background:var(--orange-soft)}
.x{border:0;background:transparent;font-size:20px;font-weight:800;color:var(--muted);padding:4px 8px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
.pos{color:var(--teal);font-weight:800}.neg{color:var(--orange);font-weight:800}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=time],textarea,select{border:2px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--card);min-width:0}
textarea{width:100%;min-height:76px;resize:vertical}
input[type=number]{width:76px}
.grow{flex:1}

/* home */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:2px solid var(--line);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:140px;background:var(--card)}
.tile b{font-family:var(--display);font-size:22px;line-height:1.1}
.tile span{font-size:14px;color:var(--muted)}
.tile .dot{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center}
.tile .dot svg{width:20px;height:20px}
.t-kid .dot{background:var(--teal)} .t-bt .dot{background:var(--orange)} .t-par .dot{background:var(--coin)} .t-bcba .dot{background:var(--plum)}
.t-kid .dot,.t-bt .dot,.t-bcba .dot{color:var(--on-accent)} .t-par .dot{color:#1E2A38}
.badge{display:inline-block;background:var(--orange);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:0 8px;margin-left:6px}
@media (max-width:360px){.tiles{grid-template-columns:1fr}}

/* page lists */
.plist{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.plist a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1.5px solid var(--line);color:inherit;text-decoration:none;font-weight:800}
.plist a:last-child{border-bottom:0}
.plist a span{flex:1;min-width:0}
.plist a small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.plist a::after{content:"›";font-size:22px;color:var(--muted)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld > b{font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--card);font-weight:700;font-size:14px;text-align:left;display:inline-flex;gap:8px;align-items:center;max-width:100%}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.chip em{font-style:normal;font-weight:800;background:var(--coin-soft);color:var(--ink);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.chip:disabled{opacity:.45;cursor:default;text-decoration:line-through}
.therm{display:flex;flex-direction:column;gap:6px}
.lvl{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);text-align:left}
.lvl i{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;color:#1E2A38}
.lvl.on{outline:4px solid var(--teal);outline-offset:1px}
.lvl small{display:block;color:var(--muted);font-size:13px}
.seg3{display:inline-grid;grid-template-columns:repeat(3,auto);border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg3 button{border:0;border-right:1.5px solid var(--line);background:var(--card);padding:6px 9px;font-size:13px;font-weight:800}
.seg3 button:last-child{border-right:0}
.seg3 button.on{background:var(--teal);color:var(--on-accent)}
.seg3 button.on.mid{background:var(--coin);color:#1E2A38}
.seg3 button.on.low{background:var(--orange-soft);color:var(--ink)}
.gr{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.gr .gi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.gr .gi:last-child{border-bottom:0}
.gr .gi > span{flex:1;min-width:150px;font-weight:700}
.gr .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gr .who small{font-weight:800;font-size:12px;color:var(--muted);width:24px}
.quizq{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.chip.right{background:var(--l1);border-color:var(--l1);color:#fff}
.chip.wrong{background:var(--orange-soft)}
.counter{display:flex;align-items:center;gap:14px}
.counter b{font-family:var(--display);font-size:32px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.counter button{width:48px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--coin);font-size:22px;font-weight:800;color:#1E2A38}
.lrow{display:flex;gap:8px;align-items:center}
.lrow input[type=text]{flex:1}
.ck{width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:var(--card);display:grid;place-items:center;flex:none;font-weight:800;padding:0}
.ck.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;padding-block:10px;background:var(--bg)}
main.nonav .savebar{bottom:env(safe-area-inset-bottom,0px)}
.intro{background:var(--teal-soft);border-radius:14px;padding:12px 14px}

/* static guide pages */
.gcard{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.gcard > h2{background:var(--ink);color:var(--bg);padding:10px 14px;font-size:19px}
.gcard .gb{padding:10px 14px;border-bottom:1.5px solid var(--line)}
.gcard .gb:last-child{border-bottom:0}
.gcard .gb h3{margin-bottom:2px}
.gcard .gb.t{background:var(--teal-soft)} .gcard .gb.y{background:var(--coin-soft)}
ul.tight{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.script{border-left:4px solid var(--teal);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px}
.script q{quotes:none;font-weight:700}
.topic{border:3px solid var(--line);border-radius:20px;padding:22px 18px;background:var(--coin-soft);text-align:center;display:flex;flex-direction:column;gap:8px;min-height:180px;justify-content:center}
.topic b{font-family:var(--display);font-size:26px}

/* tally */
.tl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1.5px solid var(--line);flex-wrap:wrap}
.tl:last-child{border-bottom:0}
.tl .nm{flex:1;min-width:150px}
.tl .nm b{display:block}
.tl .nm small{color:var(--muted);font-weight:700}
.tl .pc{font-family:var(--display);font-weight:800;font-size:20px;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.tbtn{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;min-width:52px}
.tbtn.ok{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.tbtn.no{background:var(--orange-soft)}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:700}
.chartbox{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:320px;height:auto}
.day{font-family:var(--display);font-weight:800;font-size:17px;margin-top:6px}
.entry{border:2px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.entry > button{width:100%;border:0;background:transparent;display:flex;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.entry .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px;border:1.5px solid var(--line);flex:none}
.tag.kid{background:var(--teal-soft)} .tag.bt{background:var(--orange-soft)} .tag.parent{background:var(--coin-soft)} .tag.bcba{background:var(--plum-soft)}
.entry .et{flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere}
.entry .et small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.entry .eb{padding:4px 14px 12px;display:flex;flex-direction:column;gap:6px;border-top:1.5px dashed var(--line)}
.kv{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:2px 10px;font-size:14px}
.kv dt{font-weight:800;color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.unrev{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}

/* kid tabs */
nav.kidnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:3px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .tabs{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.kidnav a{padding:9px 2px 11px;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none}
nav.kidnav a svg{width:24px;height:24px}
nav.kidnav a[aria-current="page"]{color:var(--teal)}
/* schedule */
.done{background:var(--teal-soft)}
.done .txt{text-decoration:line-through;color:var(--muted)}
.when{flex:none;width:64px;white-space:nowrap;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.when b{font-family:var(--display);font-size:15px;line-height:1.1}
.when span{font-size:12px;font-weight:700;color:var(--muted)}
.slide{position:relative;flex:none;width:104px;height:36px;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;font-size:13px;font-weight:800;overflow:hidden}
.slide .lab{position:relative;z-index:1;text-align:center}
.slide .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 4px);border-radius:999px;background:var(--coin);border:2px solid var(--line);transition:left .2s ease}
.slide[aria-checked="true"] .knob{left:calc(50% + 2px);background:var(--teal);border-color:var(--teal)}
.slide[aria-checked="false"] .l1{color:#1E2A38}
.slide[aria-checked="true"] .l2{color:var(--on-accent)}
.slide[aria-checked="true"] .l1,.slide[aria-checked="false"] .l2{color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-weight:800}
.prog .bar{flex:1;height:14px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.prog .bar i{display:block;height:100%;background:var(--teal)}
/* timer */
.dial{position:relative;width:min(240px,66vw);aspect-ratio:1;max-width:100%;margin:0 auto}
.dial svg{width:100%;height:100%}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial .center b{font-family:var(--display);font-size:28px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-right:2px solid var(--line);padding:10px;font-weight:800;background:var(--card)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-accent)}
.overlay{position:fixed;inset:0;z-index:25;background:rgba(20,27,36,.55);display:grid;place-items:center;padding:20px}
.alert{border:3px solid var(--line);border-radius:18px;background:var(--coin-soft);padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center;max-width:380px;width:100%}
.alert h2{font-size:30px}
details{border-top:1.5px dashed var(--line);padding-top:10px}
summary{font-weight:800;color:var(--teal);cursor:pointer;padding:4px 0}
.grp{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px;font-size:14px}
.bgrid div{display:flex;gap:8px;align-items:flex-start}
.ed{display:flex;align-items:center;gap:8px}
.ed input[type=text]{flex:1;padding:7px 10px}
.ed input[type=number]{width:64px;padding:7px 8px}
.ed select{padding:7px 6px;font-size:14px}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:60px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-family:var(--display);font-size:24px;font-weight:800}
.pindots{display:flex;gap:12px;justify-content:center}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.pindots i.on{background:var(--ink)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}}
@media (prefers-reduced-motion:reduce){.slide .knob{transition:none}}

/* ===== fun layer (Jacob's section) ===== */
.hello{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--coin-soft)}
.hello b{font-family:var(--display);font-size:20px}
.token{font-size:22px;line-height:1;color:var(--ink)}
.token.big{font-size:44px;width:56px;height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.chip.tok{font-size:20px;padding:2px 10px}
.boardwrap{display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(5,auto);gap:3px;border:3px solid var(--line);border-radius:14px;padding:6px;background:var(--card)}
.sq{aspect-ratio:1;border-radius:6px;background:var(--teal-soft);display:grid;place-items:center;font-weight:800;font-size:11px;color:var(--muted);position:relative;font-variant-numeric:tabular-nums}
.sq.alt{background:var(--bg)}
.sq.cost{box-shadow:inset 0 0 0 2px var(--coin)}
.sq.fill{background:var(--teal);color:var(--on-accent)}
.sq.fill small{opacity:.85}
.sq.tgt{background:var(--coin);color:#1E2A38;font-size:15px}
.sq .token{font-size:clamp(16px,5vw,24px);color:var(--on-accent)}
.wf{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);color:inherit;text-decoration:none}
.wf .star{font-size:28px;color:var(--coin);flex:none}
.empty-wf{flex-direction:column;align-items:flex-start;gap:2px;border-style:dashed}
.wfbtn{width:36px;height:36px;border:2px solid var(--line);border-radius:50%;background:var(--card);font-size:18px;color:var(--muted);flex:none;padding:0}
.wfbtn.on{background:var(--coin);color:#1E2A38}
.shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trophy{border:2px dashed var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);background:transparent}
.trophy svg{width:30px;height:30px}
.trophy b{font-size:13px;line-height:1.2}
.trophy small{font-size:11px;line-height:1.25}
.trophy.won{border-style:solid;background:var(--coin-soft);color:var(--ink)}
.trophy.won svg{color:#B8860B}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ptile{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card);color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:8px;position:relative;min-height:112px}
.ptile .pic{width:48px;height:48px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;border:2px solid var(--line)}
.ptile .pic svg{width:28px;height:28px}
.ptile b{font-size:15px;line-height:1.2}
.donebadge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--teal);color:var(--on-accent);border-radius:999px;padding:2px 7px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
/* guides */
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
ol.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--teal);color:var(--on-accent);font-weight:800;font-size:14px;display:grid;place-items:center}
dl.terms{margin:0;display:flex;flex-direction:column;gap:8px}
dl.terms dt{font-weight:800}
dl.terms dd{margin:0;color:var(--muted)}
.focus{border:2px solid var(--line);border-radius:14px;background:var(--plum-soft);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
details.how{border-top:0;padding-top:2px}
details.how summary{font-size:13px}
details.how p{font-size:14px;margin-top:4px;white-space:pre-wrap}

/* ===== round 3 ===== */
:root{--sky:#2E7DB5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#5AA8DB}}
.gr .gi.vis{gap:10px}
.gr .gi.vis > span:not(.stepno):not(.spic){min-width:120px}
.stepno{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;display:grid;place-items:center}
.spic{flex:none;width:54px;height:54px;border:2px solid var(--line);border-radius:12px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.spic svg{width:34px;height:34px}
.face{width:64px;height:64px;flex:none;color:var(--ink)}
.park{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--coin-soft)}
.chip.parked{padding-right:4px}
.chip.parked .x{font-size:15px;padding:0 6px;color:var(--teal)}
.gr .gi > span.stepno,.gr .gi > span.spic{flex:none;min-width:0}
/* decks */
.deckstart{border:3px solid var(--line);border-radius:18px;background:var(--coin-soft);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.deckstack{position:relative;width:64px;height:74px;margin-bottom:4px}
.deckstack i{position:absolute;inset:0;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.deckstack i:nth-child(1){transform:rotate(-10deg)}.deckstack i:nth-child(2){transform:rotate(5deg)}.deckstack i:nth-child(3){background:var(--orange);transform:rotate(-2deg)}
.dcard{border:3px solid var(--line);border-radius:20px;background:var(--card);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:4px 4px 0 var(--line)}
.dcard .face{width:84px;height:84px}
.dq{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25;text-wrap:balance}
.dopts{display:flex;flex-direction:column;gap:8px;width:100%}
.dopts .chip{justify-content:center;text-align:center;padding:10px 14px;font-size:15px;border-radius:14px}
.dwhy{font-size:15px}
.dcard.done{background:var(--coin-soft)}
.dcard .big{font-family:var(--display);font-weight:800;font-size:48px;line-height:1}
.ddots{display:flex;gap:5px;flex-wrap:wrap}
.ddots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.ddots i.cur{background:var(--coin)} .ddots i.ok{background:var(--l1);border-color:var(--l1)} .ddots i.miss{background:var(--orange)}
/* ===== round 5 ===== */
.goaled{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.rk{position:relative;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px}
.rk b{font-size:14px;line-height:1.25}
.rk small{color:var(--muted);font-weight:700}
.rk.on{background:var(--coin-soft)}
.rk i{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--on-accent);font-style:normal;font-weight:800;display:grid;place-items:center;border:2px solid var(--line)}
.timers{background:var(--teal-soft)}
.tbar{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:7;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);overflow:hidden}
.tbar.withnav{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.tbar.break{background:var(--teal);color:var(--on-accent)}
.tbar .tt{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.tbar .x{color:inherit}
.tbar i{position:absolute;left:0;bottom:0;height:4px;background:var(--coin)}
.ftag{flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--plum-soft)}
/* ===== round 6 ===== */
.trk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tk{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card);display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden}
.tk span{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tk b{font-family:var(--display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.tk.goal{background:var(--plum-soft)} .tk.earned{background:var(--coin-soft)} .tk.spent{background:var(--orange-soft)} .tk.saved{background:var(--teal-soft)}
.tkbar{display:block;height:5px;border-radius:3px;background:var(--card);border:1px solid var(--line);margin-top:3px;overflow:hidden}
.tkbar i{display:block;height:100%;background:var(--plum)}
.sched{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.srow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1.5px solid var(--line);border-left:6px solid var(--teal);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow.t-break{border-left-color:var(--coin)} .srow.t-play{border-left-color:var(--orange)} .srow.t-meal,.srow.t-chore{border-left-color:var(--sky)} .srow.t-arrival,.srow.t-wrap{border-left-color:var(--plum)} .srow.t-choice{border-left-color:var(--l1)} .srow.t-community{border-left-color:var(--l2)}
.srow.done{background:var(--teal-soft)}
.srow.done .txt{text-decoration:line-through;color:var(--muted)}
.sbody{flex:1;min-width:150px;display:flex;flex-direction:column;gap:1px}
.sbody .blk{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sbody .txt{font-weight:700;overflow-wrap:anywhere}
.spts{font-size:12px;font-weight:800;color:var(--teal)}
.sctl{display:flex;align-items:center;gap:2px;margin-left:auto}
.tblwrap{overflow-x:auto}
.stbl{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.stbl th,.stbl td{border-bottom:1.5px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.stbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stbl td:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:800}
.plus:disabled{opacity:.4}
.mv{display:inline-flex;align-items:center}
.mv .x{font-size:17px;padding:4px 6px}
.mv .x:disabled{opacity:.25}
.srow.editing{background:var(--coin-soft)}
.chooser{background:var(--coin-soft)}
.choose2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.choose2 .chip{justify-content:flex-start}
.earnsum{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--teal-soft);font-size:14px}
.earnsum > i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.earnsum > i > i{display:block;height:100%;background:var(--teal)}
.earnsum.full{background:var(--coin-soft)}
.earnsum.full > i > i{background:var(--coin)}
/* ===== setup sections ===== */
.secnav{display:flex;flex-wrap:wrap;gap:6px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--teal-soft)}
.secnav .chip{font-size:13px;padding:5px 11px}
details.sec{border:2px solid var(--line);border-radius:16px;background:var(--card);padding:0;overflow:hidden}
details.sec > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;color:var(--ink)}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"▸";margin-left:auto;font-size:16px;color:var(--muted);transition:transform .15s}
details.sec[open] > summary::after{transform:rotate(90deg)}
details.sec[open] > summary{border-bottom:1.5px dashed var(--line);background:var(--bg)}
details.sec .st{font-family:var(--display);font-weight:800;font-size:18px}
details.sec summary small{color:var(--muted);font-weight:700;font-size:12px;text-align:right}
.secb{padding:12px 14px}
.secb > .card{border-width:1.5px}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:2px solid var(--line);border-radius:999px;background:var(--card);padding:8px 14px;font-weight:800;box-shadow:2px 2px 0 var(--line)}
@media (prefers-reduced-motion:reduce){details.sec > summary::after{transition:none}}
.tgl{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.slide.sw{width:96px}
.req{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--coin-soft)}
.req > div{display:flex;flex-direction:column;gap:2px}
.req > i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.req > i > i{display:block;height:100%;background:var(--coin)}
.req.done{background:var(--teal-soft)} .req.done > i > i{background:var(--teal)}
.trst{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-top:3px;border:1.5px solid var(--line)}
.trst.low{background:var(--orange-soft)} .trst.ok{background:var(--teal-soft)} .trst.max{background:var(--coin-soft)}
.tl.met{background:color-mix(in srgb, var(--teal-soft) 45%, transparent)}
.tbtn:disabled{opacity:.35}
@media (max-width:380px){.req{grid-template-columns:1fr}}
.howrow{flex-basis:100%;margin-top:-2px}
/* wrap up */
ol.wsteps{list-style:none;margin:0;padding:0;counter-reset:w;display:flex;flex-direction:column;gap:10px}
ol.wsteps li{counter-increment:w;border:2px solid var(--line);border-radius:14px;padding:12px 14px 12px 50px;position:relative;background:var(--card);display:flex;flex-direction:column;gap:6px}
ol.wsteps li::before{content:counter(w);position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;display:grid;place-items:center;font-size:14px}
ol.wsteps li.ok{background:var(--teal-soft)}
ol.wsteps li.ok::before{content:"✓";background:var(--teal);color:var(--on-accent)}
.ws{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 8px;border:1.5px solid var(--line);white-space:nowrap}
.ws.ok{background:var(--teal);color:var(--on-accent);border-color:var(--teal)} .ws.todo{background:var(--card)} .ws.warn{background:var(--orange-soft)}
.ckrow{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;font-weight:700;text-align:left}
.wrapbtn{background:var(--coin-soft)}
.wrapdone{background:var(--teal-soft)}
ol.wsteps li.opt{border-style:dashed}
/* library */
.libtabs{position:relative}
details.libg{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
details.libg > summary{display:flex;gap:8px;align-items:baseline;cursor:pointer;flex-wrap:wrap}
details.libg > summary small{color:var(--muted);font-weight:700;font-size:12px}
.chipwrap{display:inline-flex;align-items:center}
.chip.own{border-style:dashed}
.chipx{border:0;background:transparent;font-weight:800;color:var(--muted);padding:2px 4px;margin-left:-2px}
.pluschip{border-style:dashed;background:var(--coin-soft);font-weight:800}
.addown{gap:6px;flex-wrap:nowrap}
.addown input{width:160px}
.topic.drawn{animation:none}
@media (prefers-reduced-motion:no-preference){.topic.drawn{animation:flip .4s ease}@keyframes flip{0%{transform:rotateY(80deg)}100%{transform:rotateY(0)}}}
.turnchain{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);min-height:52px}
.turnchain i{font-style:normal;color:var(--muted);font-weight:800}
.tb{border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;border:2px solid var(--line)}
.tb.m{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.tb.p{background:var(--coin-soft)}
.turnbtn{flex:1;min-width:120px;font-size:16px;padding:12px}
.turnbtn.m{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
.turnbtn.p{background:var(--coin-soft)}
.exc{font-size:16px}.exc b{font-family:var(--display);font-size:24px}
.storylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.story{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.story .pic{width:48px;height:48px;border-radius:14px;background:var(--plum);color:#fff;display:grid;place-items:center;border:2px solid var(--line)}
.story .pic svg{width:28px;height:28px}
.story b{font-size:15px;line-height:1.25}
.story.read{background:var(--teal-soft)}
/* hub */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.ccard.off{opacity:.7;border-style:dashed}
.cname{font-family:var(--display);font-size:22px;line-height:1.1}
.hubedit{border-top:1.5px dashed var(--line);padding-top:10px;margin-top:4px}
.linkbox{display:flex;flex-direction:column;gap:4px}
.linkbox input{width:100%;font-size:13px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card)}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:700}
.ordiv::before,.ordiv::after{content:"";flex:1;border-top:1.5px solid var(--line);opacity:.4}

const LEVELS = [

const TOOLS = ['Squeeze my hands','Push my palms together','Push the wall','Chewy','Fidget','5 slow breaths','Stretch tall','Ask for a break','Drink of water','Count to 10','Heavy work (carry something)','Quiet corner'];
const FEELINGS = ['Happy','Excited','Proud','Calm','Silly','Bored','Tired','Worried','Nervous','Frustrated','Mad','Sad','Embarrassed','Left out'];

const PAGES = {

  {k:'scale',id:'level',label:'Right now I am at',opts:LEVELS},

/* ================= state + store ================= */
const blankState = () => ({name:'', now:0, saved:0, earn:[], rewards:[], sched:[], checkPts:1, goals:[], tally:{}, pin:'', focus:'', target:'', token:'♞', parking:[], appName:'', rateItems:[], goal:50, savedScheds:[], timerOn:true});
let S = blankState();        // shared settings, balances, lists
let E = [];                  // entries (history), newest first
let me = 'this device';
let user = null, fdb = null, authState = 'local', unsubs = [];
let CID=null, CMETA=null, CLIENTS=[], clientUnsubs=[], clientsUnsub=null;
const BCBAS = ((window.GAMEPLAN_BCBAS)||[]).map(x=>String(x).toLowerCase());
const KS=()=>'gp2-c-'+CID+'-state', KE=()=>'gp2-c-'+CID+'-entries', KD=()=>'gp2-c-'+CID+'-drafts';
const LS_CLIENTS='gp2-clients', LS_CUR='gp2-cur';
const HIST_DAYS=30, histCut=()=>Date.now()-HIST_DAYS*864e5;
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

const Store = {
  mode:'local',
  patch(obj){
    if(this.mode==='remote'){ const ref=cref().collection('app').doc('state'); ref.update(obj).catch(()=>ref.set(obj,{merge:true})).catch(writeErr); return; }
    Object.assign(S, JSON.parse(JSON.stringify(obj))); lsSet(KS(),S); changed();
  },
  incr(path,n){
    if(this.mode==='remote'){
      const ref=cref().collection('app').doc('state'), inc=firebase.firestore.FieldValue.increment(n);
      ref.update({[path.join('.')]:inc}).catch(()=>{ const o={}; let c=o; path.forEach((p,i)=>{ c[p]= i===path.length-1 ? inc : {}; c=c[p]; }); return ref.set(o,{merge:true}); }).catch(writeErr);
      return;
    }
    let c=S; for(let i=0;i<path.length-1;i++){ if(typeof c[path[i]]!=='object'||!c[path[i]]) c[path[i]]={}; c=c[path[i]]; }
    const k=path[path.length-1]; c[k]=(+c[k]||0)+n; lsSet(KS(),S); changed();
  },
  setPath(path,v){
    if(this.mode==='remote'){ const ref=cref().collection('app').doc('state'); ref.update({[path.join('.')]:v}).catch(()=>{ const o={}; let c=o; path.forEach((p,i)=>{ c[p]= i===path.length-1 ? v : {}; c=c[p]; }); return ref.set(o,{merge:true}); }).catch(writeErr); return; }
    let c=S; for(let i=0;i<path.length-1;i++){ if(typeof c[path[i]]!=='object'||!c[path[i]]) c[path[i]]={}; c=c[path[i]]; } c[path[path.length-1]]=v; lsSet(KS(),S); changed();
  },
  add(e){
    const doc = Object.assign({type:'page', role:'kid', title:'', data:{}, reviewed:false}, e, {t:Date.now(), by:me});
    if(this.mode==='remote'){ cref().collection('entries').add(JSON.parse(JSON.stringify(doc))).catch(writeErr); return; }
    doc.id=uid(); E.unshift(doc); E=E.slice(0,1000); lsSet(KE(),E); changed();
  },
  del(id){
    if(this.mode==='remote'){ cref().collection('entries').doc(id).delete().catch(writeErr); return; }
    E=E.filter(x=>x.id!==id); lsSet(KE(),E); changed();
  },
  upd(id,f){
    if(this.mode==='remote'){ cref().collection('entries').doc(id).update(f).catch(writeErr); return; }
    const x=E.find(x=>x.id===id); if(x) Object.assign(x,f); lsSet(KE(),E); changed();
  }
};
function cref(){ return fdb.collection('clients').doc(CID); }
function writeErr(e){ toast(e && e.code==='permission-denied' ? 'This account can\'t save. Ask your BCBA to add your email.' : 'Couldn\'t save. Check your connection.'); }
function loadLocal(){ S=Object.assign(blankState(), lsGet(KS())||{}); const all=lsGet(KE())||[]; const kept=all.filter(e=>e.t>=histCut()); E=kept; if(kept.length!==all.length) lsSet(KE(),kept); drafts=lsGet(KD())||{}; }

/* re-render on data change, but never while someone is typing */
let pendingRender=false;
function changed(){
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=='button'){ pendingRender=true; paintWallet(); return; }
  render();
}
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(pendingRender){ const a=document.activeElement; if(!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){ pendingRender=false; render(); } } },60); });

/* ================= helpers ================= */
let drafts = {};
const saveDrafts = () => { if(CID) lsSet(KD(), drafts); };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2000); }
const today = () => new Date().toDateString();
const fmtTime = t => { const [h,m]=t.split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm'); };
const addMin = (t,n) => { const [h,m]=t.split(':').map(Number); const x=(h*60+m+n)%1440; return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); };
const when = t => new Date(t).toLocaleString([], {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
const clock = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const isPts = e => e.type==='points'||e.type==='cashin'||e.type==='save';
const playerName = () => S.name || 'Player';
const brand = () => S.appName || (S.name ? S.name+'\'s Game Plan' : 'My Game Plan');
const itText = it => Array.isArray(it) ? it[0] : it;
const picSVG = k => PICTO[k] ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PICTO[k]}</svg>` : '';
function faceSVG(k){ const F=FACES[k]; if(!F) return '';

  return `<svg class="face" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--coin-soft)"/>${eyes}<path d="${F.brow}"/><path d="${F.mouth}"/></svg>`; }
let unlocked = false;

/* ================= render shell ================= */
function render(){
  const r = route();
  if(Store.mode==='remote' && !user){ return paint(authState==='checking' ? viewLoading() : viewSignin()); }
  if(!CID) return paint(viewHub());
  if(!(ROLE_SECS[myRole()]||[]).includes(r.sec)){ return paint(viewHome()); }
  const locked = ['bt','parent','bcba','setup'].includes(r.sec) && S.pin && !unlocked;
  if(locked) return paint(viewPin(r));
  let v;
  if(r.sec==='kid') v = viewKid(r.id||'today');
  else if(r.sec==='bt') v = r.id ? viewPage(r.id,'bt') : viewIndex('bt');
  else if(r.sec==='parent') v = r.id ? viewPage(r.id,'parent') : viewIndex('parent');
  else if(r.sec==='bcba') v = r.id==='main' ? viewMain() : r.id ? viewPage(r.id,'bcba') : viewProgress();
  else if(r.sec==='setup') v = viewSetup();
  else v = viewHome();
  paint(v);
}
function paint(v){
  try{ document.title = brand(); const m=document.querySelector('meta[name=apple-mobile-web-app-title]'); if(m) m.content=brand(); }catch(e){}
  $('app').innerHTML = `<header><div class="htitle">${v.back?`<button class="back" data-a="go" data-h="${v.back}">‹ ${esc(v.backLabel||'Back')}</button>`:`<span class="eyebrow">${esc(v.eyebrow||'')}</span>`}<h1>${esc(v.title)}</h1></div>${v.wallet?walletHTML():''}</header><main class="${v.nav?'':'nonav'}">${v.wallet?trackersHTML():''}${v.body}</main>`;
  $('kidnav').hidden = !v.nav;
  if(v.nav) $('kidnav').innerHTML = `<div class="tabs" style="grid-template-columns:repeat(${timerOn()?5:4},1fr)">${['today','points','rewards'].concat(timerOn()?['timer']:[],['pages']).map(t=>`<a href="#kid/${t}" ${v.nav===t?'aria-current="page"':''}>${ICON[t]}${t[0].toUpperCase()+t.slice(1)}</a>`).join('')}</div>`;
  if(v.after) v.after();
  paintTimer(); paintTbar();
}
const timerOn = () => S.timerOn!==false;
/* preset libraries: BCBA edits live in S.lib and override the built-in lists */
const clone = x => JSON.parse(JSON.stringify(x));
const libGoals  = () => (S.lib&&S.lib.goals)  || GOAL_PRESETS.map(p=>Object.assign({id:p.code},p));
const libEarn   = () => (S.lib&&S.lib.earn)   || EARN_IDEAS;
const libRew    = () => (S.lib&&S.lib.rew)    || REW_IDEAS;
const libRates  = () => (S.lib&&S.lib.rates)  || RATE_PRESETS;
const libTopics = () => (S.lib&&S.lib.topics) || TOPICS;
function libSet(kind, val){ Store.patch({lib:Object.assign({}, S.lib||{}, {[kind]:val})}); }
const goalMax = () => Math.max(1, +S.goal || 50);
const EARN_MAX_ITEMS = 15;
const earnTotal = (list) => (list||S.earn).reduce((s,e)=>s+(+e.pts||0),0);
function earnCheck(newList){ if(newList.length>EARN_MAX_ITEMS){ toast(`Keep it to ${EARN_MAX_ITEMS} ways to earn. Remove one first.`); return false; }
  if(earnTotal(newList)>goalMax()){ toast(`That would put the list over the ${goalMax()}-point session max. Lower a value or remove one first.`); return false; } return true; }
function todayStats(){ const k=today(); let earned=0, spent=0; E.forEach(e=>{ if(new Date(e.t).toDateString()!==k) return; if(e.type==='points') earned+=e.data.d||0; if(e.type==='cashin') spent+=-(e.data.d||0); }); return {earned:Math.max(0,earned), spent}; }
function trackersHTML(){ const t=todayStats(), g=goalMax(), pct=Math.min(100,Math.round(t.earned/g*100));
  return `<div class="trk" id="trk"><div class="tk goal"><span>Goal</span><b>${g}</b><i class="tkbar"><i style="width:${pct}%"></i></i></div><div class="tk earned" id="coinNow"><span>Earned</span><b id="trkE">${t.earned}</b></div><div class="tk spent"><span>Spent</span><b id="trkS">${t.spent}</b></div><div class="tk saved"><span>Saved</span><b id="trkB">${S.saved}</b></div></div>`; }
function walletHTML(){ return ''; }
function paintWallet(){ const el=$('trk'); if(el) el.outerHTML=trackersHTML(); }

/* ================= client hub ================= */
let hubEdit=null, hubAdd=false, hubMsg='';
const RUNTIME_KEYS=['now','saved','tally','parking','target','pin'];
function slugId(name){ return (name||'client').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)+'-'+Math.random().toString(36).slice(2,6); }
function clientLink(id){ return location.origin+location.pathname+'#@'+id; }
const emailsFrom = s => String(s||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(x=>/@/.test(x));
function viewHub(){
  const bc=isBcbaUser(); const list=CLIENTS.slice().sort((x,y)=>(y.active!==false)-(x.active!==false)||String(x.name).localeCompare(String(y.name)));
  const card=c=>{ const l=c.last; const ed=hubEdit===c.id;
    return `<div class="ccard ${c.active===false?'off':''}"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="stack" style="gap:2px"><b class="cname">${esc(c.name)}</b><span class="note">${esc(c.appName||(c.name+'\'s Game Plan'))}</span></div>${c.active===false?'<span class="pill">Inactive</span>':''}</div>
      <span class="note">${l?`Last session ${new Date(l.t).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})} · ${l.earned} pts${l.need?` · ${l.run}/${l.need} goals`:''}`:'No sessions wrapped up yet'}</span>
      ${bc?`<span class="note">${(c.bt||[]).length} BT · ${(c.parent||[]).length} parent account${(c.parent||[]).length===1?'':'s'}</span>`:''}
      <div class="row wrap" style="gap:6px"><button class="btn primary small" data-a="hubopen" data-id="${c.id}">Open</button>${bc?`<button class="btn small" data-a="hublink" data-id="${c.id}">Copy link</button><button class="btn small ghost" data-a="hubedit" data-id="${c.id}">${ed?'Close':'Edit'}</button>`:''}</div>
      ${ed?`<div class="stack hubedit"><label class="fld"><b>Client name (first name only)</b><input type="text" id="he-name" value="${esc(c.name)}" maxlength="30"></label>
        <label class="fld"><b>BT emails</b><textarea id="he-bt" placeholder="One per line" style="min-height:60px">${esc((c.bt||[]).join('\n'))}</textarea></label>
        <label class="fld"><b>Parent emails</b><textarea id="he-parent" placeholder="One per line" style="min-height:60px">${esc((c.parent||[]).join('\n'))}</textarea></label>
        <span class="note">They sign in with this email, using Google or a sign-in link sent to their inbox. No password needed.</span>
        <label class="row"><input type="checkbox" id="he-active" ${c.active!==false?'checked':''}> <span>Active (uses the app)</span></label>
        <div class="row"><button class="btn primary" data-a="hubsave" data-id="${c.id}">Save</button><button class="btn" data-a="hubedit" data-id="${c.id}">Cancel</button></div>
        <div class="linkbox"><span class="note">Personalized link to share with this client's BT and family:</span><input type="text" readonly value="${esc(clientLink(c.id))}" onclick="this.select()"></div></div>`:''}
    </div>`; };
  return {eyebrow: bc?'BCBA hub':'Game Plan', title: bc?'My Clients':'Choose a client', body:`
    ${hubMsg?`<div class="card" style="background:var(--teal-soft)">${hubMsg}</div>`:''}
    ${bc?`<div class="row wrap" style="justify-content:space-between"><span class="note">${list.filter(c=>c.active!==false).length} active · ${list.length} total</span><button class="btn primary" data-a="hubadd">${hubAdd?'Close':'+ Add client'}</button></div>`:''}
    ${bc&&hubAdd?`<div class="card stack"><b>New client</b><label class="fld"><b>First name</b><input type="text" id="hn-name" maxlength="30" placeholder="First name only"></label>
      <label class="fld"><b>Start from</b><select id="hn-from"><option value="blank">Blank setup (built-in presets)</option>${list.map(c=>`<option value="copy:${c.id}">Copy ${esc(c.name)}'s setup (goals, lists, presets, schedules)</option>`).join('')}</select></label>
      <span class="note">Copying brings over the setup only, not points, history or uploaded files. Edit goals and presets for the new client afterward in their BCBA Setup.</span>
      <button class="btn primary" data-a="hubcreate">Create client</button></div>`:''}
    ${list.length?`<div class="cgrid">${list.map(card).join('')}</div>`:`<div class="empty">${bc?'No clients yet. Tap "+ Add client" to set up your first one.':'No clients are shared with you yet. Ask your BCBA to add your email.'}</div>`}
    <div class="row wrap" style="justify-content:space-between"><span class="note">${Store.mode==='remote'?`Signed in as ${esc(user&&user.email||'')}`:'Saving on this device only.'}</span>${Store.mode==='remote'?'<button class="btn small" data-a="signout">Sign out</button>':''}</div>`};
}
function stripRuntime(st){ const o=clone(st||{}); RUNTIME_KEYS.forEach(k=>delete o[k]); if(Array.isArray(o.sched)) o.sched=o.sched.map(s=>Object.assign({},s,{done:false})); return o; }
async function createClient(){
  const name=($('hn-name').value||'').trim(); if(!name){ $('hn-name').focus(); return; }
  const from=$('hn-from').value; const id=slugId(name);
  let st={name, appName:''};
  try{
    if(from.startsWith('copy:')){ const src=from.slice(5);
      if(Store.mode==='remote'){ const s=await fdb.collection('clients').doc(src).collection('app').doc('state').get(); st=Object.assign(stripRuntime(s.data()||{}),{name, appName:''}); }
      else st=Object.assign(stripRuntime(lsGet('gp2-c-'+src+'-state')||{}),{name, appName:''}); }
    const meta={name, active:true, bt:[], parent:[], members:[], created:Date.now()};
    if(Store.mode==='remote'){ await fdb.collection('clients').doc(id).set(meta); await fdb.collection('clients').doc(id).collection('app').doc('state').set(st); }
    else { CLIENTS.push(Object.assign({id},meta)); saveClientsLocal(); lsSet('gp2-c-'+id+'-state', st); }
    hubAdd=false; hubEdit=id; hubMsg=`<b>${esc(name)} added.</b> Add their BT and parent emails below, then share their personalized link.`; render();
  }catch(e){ toast('Couldn\'t create the client. Check your connection.'); }
}
async function saveClientMeta(id){
  const name=($('he-name').value||'').trim(); const bt=emailsFrom($('he-bt').value), parent=emailsFrom($('he-parent').value); const active=$('he-active').checked;
  const upd={name:name||'Client', bt, parent, members:[...new Set(bt.concat(parent))], active};
  try{ if(Store.mode==='remote') await fdb.collection('clients').doc(id).set(upd,{merge:true});
    else { const c=CLIENTS.find(x=>x.id===id); Object.assign(c,upd); saveClientsLocal(); }
    hubEdit=null; hubMsg=''; toast('Saved'); render(); }catch(e){ toast('Couldn\'t save. Check your connection.'); }
}
async function seedJacob(){
  const id='jacob-'+Math.random().toString(36).slice(2,6);
  const meta={name:'Jacob', active:true, bt:[], parent:[], members:[], created:Date.now(), starter:true};
  const st={name:'Jacob', appName:'Jacob\'s Game Plan'};
  if(Store.mode==='remote'){ await fdb.collection('clients').doc(id).set(meta); await fdb.collection('clients').doc(id).collection('app').doc('state').set(st); }
  else { CLIENTS.push(Object.assign({id},meta)); saveClientsLocal(); lsSet('gp2-c-'+id+'-state', st); }
  return id;
}
function updateMeta(obj){ if(!CID) return; if(Store.mode==='remote'){ cref().set(obj,{merge:true}).catch(()=>{}); } else { const c=CLIENTS.find(x=>x.id===CID); if(c){ Object.assign(c,obj); saveClientsLocal(); } } }

/* ================= PIN ================= */
let pinTry='';
function viewPin(r){
  return {back:'home', backLabel:'Home', title:'Grown-ups only', body:`

  return `${timerToggle()}<p class="note">The chime goes off at random times around the average you pick. When it rings, check: calm body and following the plan? Then give the check-in points.</p>
  <div class="seg" role="group" aria-label="Average time between checks">${[3,5,10].map(a=>`<button data-a="avg" data-v="${a}" aria-pressed="${avg===a}">About ${a} min</button>`).join('')}</div>
  <div class="dial"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--teal-soft)" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg>
    <div class="center"><span class="note" id="dialLabel">Ready</span><b id="dialTime">--</b><span class="note">${checksToday()} good checks today</span></div></div>
  <div class="row" style="justify-content:center"><button class="btn primary" data-a="timer" id="timerBtn" style="min-width:150px">Start timer</button><button class="btn" data-a="chime">Test chime</button></div>
  <p class="note">The countdown is hidden so checks feel like a surprise. The timer keeps running while you use other pages. Sound needs the ringer on.</p>`;

const checksToday = () => E.filter(e=>e.type==='points'&&e.data&&e.data.check&&new Date(e.t).toDateString()===today()).length;
function schedule(){ const sec=avg*60*(0.5+Math.random()); span=sec*1000; due=Date.now()+span; }
async function startTimer(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); await actx.resume(); }catch(e){}
  try{ wake=await navigator.wakeLock.request('screen'); }catch(e){}
  running=true; schedule(); tickH=setInterval(step,500); paintTimer();
}
function stopTimer(){ running=false; clearInterval(tickH); try{ wake&&wake.release(); }catch(e){} wake=null; paintTimer(); }
function step(){ if(!running) return; if(due-Date.now()<=0){ chime(); alerting=true; schedule(); } paintTimer(); }
function paintTimer(){
  if($('timerBtn')){ $('timerBtn').textContent=running?'Stop timer':'Start timer'; $('dialLabel').textContent=running?'Timer on':'Ready'; $('dialTime').textContent=running?'Watching':'--';
    $('arc').style.strokeDashoffset = running ? (326.7*(1-Math.max(0,due-Date.now())/span)).toFixed(1) : 0; }
  $('overlay').hidden=!(alerting||tAlert);
  if(!alerting && tAlert){ const b=tAlert.kind==='break';
    $('overlay').innerHTML=`<div class="alert" role="alertdialog" aria-label="Timer done"><h2>${b?'Break\'s over!':'Time to switch!'}</h2><span>${b?'Back to work.':(tAlert.label?'Next: '+esc(tAlert.label):'On to the next thing.')}</span><div class="row wrap" style="justify-content:center"><button class="btn coinbtn" data-a="tdone" data-pts="${b?1:2}" data-note="${b?'Came back from a break right away':'Switched activities when the timer rang'}">${b?'Came back right away: +1':'Switched right away: +2'}</button><button class="btn" data-a="tdone" data-pts="0">Close</button></div></div>`; }
  if(alerting) $('overlay').innerHTML=`<div class="alert" role="alertdialog" aria-label="Check-in"><h2>Check-in!</h2><span>Calm body and following the plan right now?</span><div class="row" style="justify-content:center"><button class="btn coinbtn" data-a="chkyes">Yes: +${S.checkPts}</button><button class="btn" data-a="chkno">Not this time</button></div></div>`;
}
function chime(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); actx.resume();
    [659,880,1047].forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type='sine'; o.frequency.value=f; const t=actx.currentTime+i*0.18; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.5); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.55); }); }catch(e){}
  try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
}

  const done=new Set(E.filter(e=>e.type==='page'&&e.role==='kid'&&new Date(e.t).toDateString()===today()).map(e=>e.data.page));

function D(pid){ return drafts[pid] || (drafts[pid]={}); }
function hasVal(v){ if(v==null||v==='') return false; if(Array.isArray(v)) return v.length>0; if(typeof v==='object') return Object.values(v).some(hasVal); return true; }

const SHAPE={text:'s',long:'s',chips:'sa',scale:'n',counter:'n',grid:'o',check:'o',list:'o',quiz:'o',deck:'o',topicdraw:'o',turns:'a',rank:'a'};
function cleanDraft(pid){ const p=PAGES[pid]; const d=D(pid); if(!p||!p.fields) return d; let changed=false;
  p.fields.forEach(f=>{ const v=d[f.id]; if(v==null) return; const s=SHAPE[f.k]; let ok=true;
    if(s==='s') ok=typeof v==='string'; else if(s==='n') ok=typeof v==='number'; else if(s==='a') ok=Array.isArray(v);
    else if(s==='o') ok=typeof v==='object'&&!Array.isArray(v); else if(s==='sa') ok=f.multi?Array.isArray(v):typeof v==='string';
    if(ok&&f.k==='list') ok=Array.isArray(v.text); if(ok&&f.k==='deck') ok=!v.pick||Array.isArray(v.pick);
    if(!ok){ delete d[f.id]; changed=true; } });
  Object.keys(d).forEach(k=>{ if(!p.fields.some(f=>f.id===k)){ delete d[k]; changed=true; } });
  if(changed) saveDrafts(); return d; }
function formBody(pid, role){

function presetFor(g){ const nm=(g.name||'').toLowerCase(); return libGoals().find(p=>(g.pid&&p.id===g.pid)||(g.code&&p.code&&p.code.toLowerCase()===String(g.code).toLowerCase())||p.name.toLowerCase()===nm); }

function sessionHours(){ if(+S.sessionHours>0) return {h:+S.sessionHours, src:'set in Setup'};
  const tm=S.sched.filter(s=>s.time); if(tm.length){ const toM=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; }; const st=Math.min(...tm.map(s=>toM(s.time))), en=Math.max(...tm.map(s=>toM(s.time)+(+s.min||0))); if(en>st) return {h:Math.round((en-st)/30)/2, src:"from today's schedule"}; }
  return {h:3, src:'default'}; }
const goalsNeeded = () => Math.ceil(sessionHours().h*2);

    const st = n===0 ? '' : n<TR_MIN ? `<span class="trst low">${TR_MIN-n} more needed</span>` : full ? `<span class="trst max">Max ${TR_MAX} reached</span>` : `<span class="trst ok">${n} of ${TR_MIN}–${TR_MAX} ✓</span>`;

let FILES=[], filesLoaded=false, fileBusy='';
const MAXF=8*1024*1024, CH=700000;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('gp2files',1); r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbDo(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('files',mode); const q=fn(t.objectStore('files')); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); })); }
async function loadFiles(){ if(Store.mode==='remote') return; try{ const all=await idbDo('readonly',s=>s.getAll()); FILES=(all||[]).map(f=>({id:f.id,name:f.name,title:f.title,cat:f.cat,type:f.type,size:f.size,t:f.t,by:f.by})).sort((x,y)=>y.t-x.t); }catch(e){ FILES=[]; } filesLoaded=true; render(); }
const b64ToBlob=(b64,type)=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||'application/octet-stream'}); };
const readB64=file=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
async function addFile(file, cat){ cat=cat||'material'; const title=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  if(file.size>MAXF){ toast(`${file.name} is over 8 MB. Try a smaller file.`); return; }
  fileBusy='Uploading '+file.name+'…'; render();
  try{
    if(Store.mode==='remote'){ const b64=await readB64(file); const ref=cref().collection('files').doc(); const n=Math.ceil(b64.length/CH)||1;
      for(let i=0;i<n;i++){ await ref.collection('chunks').doc(String(i)).set({n:i,d:b64.slice(i*CH,(i+1)*CH)}); }
      await ref.set({name:file.name,title,cat,type:file.type,size:file.size,t:Date.now(),by:me,chunks:n}); }
    else { await idbDo('readwrite',s=>s.put({id:uid(),name:file.name,title,cat,type:file.type,size:file.size,t:Date.now(),by:me,blob:file})); await loadFiles(); }
    toast('Uploaded '+file.name);
  }catch(e){ toast('Couldn\'t upload '+file.name+'. Check your connection.'); }
  fileBusy=''; render();
}
async function getBlob(id){
  if(Store.mode==='remote'){ const f=FILES.find(x=>x.id===id); const q=await cref().collection('files').doc(id).collection('chunks').orderBy('n').get(); return b64ToBlob(q.docs.map(x=>x.data().d).join(''), f&&f.type); }
  const rec=await idbDo('readonly',s=>s.get(id)); return rec&&rec.blob;
}
async function delFile(id){
  try{ if(Store.mode==='remote'){ const ref=cref().collection('files').doc(id); const q=await ref.collection('chunks').get(); for(const x of q.docs) await x.ref.delete(); await ref.delete(); }
    else { await idbDo('readwrite',s=>s.delete(id)); await loadFiles(); } toast('Deleted'); }catch(e){ toast('Couldn\'t delete it'); }
}
async function renameFile(id,title){
  try{ if(Store.mode==='remote'){ await cref().collection('files').doc(id).update({title}); }
    else { const rec=await idbDo('readonly',s=>s.get(id)); if(rec){ rec.title=title; await idbDo('readwrite',s=>s.put(rec)); await loadFiles(); } } toast('Renamed'); }catch(e){ toast('Couldn\'t rename it'); } }

  const trials=S.goals.reduce((s,g)=>s+(+(T[gkey(g)]||{}).n||0),0); const ts=todayStats();
  const savedToday=E.filter(e=>e.type==='save'&&isToday(e.t)).reduce((s,e)=>s+(e.data.n||0),0);
  const howdid=E.some(e=>e.type==='page'&&e.data.page==='howdid'&&isToday(e.t)), summary=E.some(e=>e.type==='page'&&e.data.page==='summary'&&isToday(e.t));
  return {run, short, need:goalsNeeded(), trials, earned:ts.earned, spent:ts.spent, savedToday, howdid, summary, left:S.now}; }
function wrapBody(){

   <li class="${(wrapCR||!w.trials)?'ok':''}"><div class="row" style="justify-content:space-between"><b>Data entered in CentralReach</b>${ok(wrapCR||!w.trials)}</div>
     ${w.trials?`<button class="ckrow" data-a="wcr" aria-pressed="${wrapCR}"><span class="ck ${wrapCR?'on':''}">${wrapCR?'✓':''}</span>I entered every trial in CR</button><span class="note">The tally clears when you finish.</span>`:'<span class="note">No trials in the tally.</span>'}</li>
   <li class="${w.summary?'ok':'opt'}"><div class="row" style="justify-content:space-between"><b>Session notes for your BCBA <span class="note">(optional)</span></b>${w.summary?'<span class="ws ok">✓ Done</span>':'<span class="ws todo">Optional</span>'}</div>

function wrapKV(d){ return [['Points earned',d.earned],['Points spent',d.spent],['Saved to bank',d.savedToday],['Bank total',d.bank],['Goals run',`${d.run} of ${d.need} needed`],['Trials recorded',d.trials],['How Did I Do?',d.howdid?'Done':'Skipped (optional)'],['Session notes',d.summary?'Added':'None (optional)'],['Session length',d.hours+' h']].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join(''); }
function wrapFinish(){
  const w=wrapStats(); let saved=w.savedToday;
  if(S.now>0){ const n=S.now; Store.incr(['saved'],n); Store.incr(['now'],-n); Store.add({type:'save', role:'kid', title:`Saved ${n} points for later`, data:{n}}); saved+=n; }
  if(w.trials){ const T=S.tally||{}; const goals=S.goals.map(g=>{ const t=T[gkey(g)]||{}; return {name:g.name,ok:+t.ok||0,n:+t.n||0,t0:t.t0||null,t1:t.t1||null}; }).filter(g=>g.n>0);
    Store.add({type:'tally', role:'bt', title:`Goal data entered in CR (${goals.length} goals)`, data:{goals}}); Store.patch({tally:{}}); talStack=[]; }
  Store.patch({sched:S.sched.map(x=>Object.assign({},x,{done:false})), parking:[]});
  try{ stopTimer(); }catch(e){} tmr=null; alerting=false; tAlert=null; paintTbar();
  const rec={earned:w.earned, spent:w.spent, savedToday:saved, bank:(S.saved||0)+(S.now>0?0:0), run:w.run, need:w.need, short:w.short, trials:w.trials, howdid:w.howdid, summary:w.summary, hours:sessionHours().h};
  rec.bank = (+S.saved||0);
  Store.add({type:'wrap', role:'bt', title:`Session wrapped up: ${w.earned} earned, ${w.run}/${w.need} goals`, data:rec});
  updateMeta({last:{t:Date.now(), earned:rec.earned, run:rec.run, need:rec.need}});
  wrapDone=rec; wrapCR=false; render(); confetti(120);
}

function valueText(f,v){
  switch(f.k){
  case 'text': case 'long': return esc(v);
  case 'chips': return esc(Array.isArray(v)?v.join(', '):v);
  case 'scale': { const o=f.opts.find(o=>o.v===v); return o?`${v} · ${esc(o.label)}`:esc(v); }
  case 'counter': return esc(v);
  case 'grid': { f=Object.assign({},f,{rows:Object.keys(v)}); let out=f.rows.filter(r=>v[r]).map(r=>`${esc(r)}: ${f.who.map(w=>`${f.who.length>1?esc(w)+' ':''}${v[r][w]!=null?RATE[v[r][w]]:'–'}`).join(', ')}`).join('<br>');
    if(f.who.length===2){ let a=0,b=0; f.rows.forEach(r=>{ const x=v[r]||{}; if(x[f.who[0]]!=null&&x[f.who[1]]!=null){ b++; if(x[f.who[0]]===x[f.who[1]]) a++; } }); if(b) out+=`<br><b>Matched ${esc(f.who[1])} on ${a} of ${b}</b>`; }
    return out; }
  case 'check': { const c=[0,0,0]; Object.values(v).forEach(x=>c[x]++); const help=f.items.filter((_,i)=>v[i]===1).map(itText), ny=f.items.filter((_,i)=>v[i]===0).map(itText);
    if(f.labels) return `Yes ${c[2]} · Partly ${c[1]} · No ${c[0]} (of ${f.items.length})${(c[0]+c[1]+c[2])?` · <b>${Math.round((c[2]+c[1]*0.5)/(c[0]+c[1]+c[2])*100)}%</b>`:''}${help.length?`<br>Partly: ${esc(help.join(', '))}`:''}${ny.length?`<br>No: ${esc(ny.join(', '))}`:''}`;
    return `Myself ${c[2]} · Help ${c[1]} · Not yet ${c[0]} (of ${f.items.length})${help.length?`<br>Help: ${esc(help.join(', '))}`:''}${ny.length?`<br>Not yet: ${esc(ny.join(', '))}`:''}`; }
  case 'list': return (v.text||[]).map((t,i)=>t?`${v.ck&&v.ck[i]?'✓ ':''}${esc(t)}`:'').filter(Boolean).join('<br>');
  case 'topicdraw': { const c=v&&v.i!=null?libTopics()[v.i]:null; return c?`${esc(c[0])}: ${esc(c[1])}`:''; }
  case 'turns': { const arr=Array.isArray(v)?v:[]; let ex=0; for(let k=1;k<arr.length;k++) if(arr[k]==='m'&&arr[k-1]==='p') ex++; return `<b>${ex} back-and-forth${ex===1?'':'s'}</b> · ${arr.map(t=>t==='m'?'Me':'Partner').join(' → ')}`; }
  case 'rank': return (v||[]).map((t,i)=>`${i+1}. ${esc(t)}`).join('<br>');
  case 'deck': { if(!v||!v.pick) return ''; const ans=v.pick.map((ci,k)=>[ci,k]).filter(([ci,k])=>v.first[k]!=null); const r=ans.filter(([ci,k])=>v.first[k]===f.cards[ci].a); const miss=ans.filter(([ci,k])=>v.first[k]!==f.cards[ci].a);
    return `<b>${r.length} of ${ans.length} right on the first try</b> (${ans.length?Math.round(r.length/ans.length*100):0}%)${miss.length?`<br>Missed: ${esc(miss.map(([ci])=>f.cards[ci].q).join(' · '))}`:''}`; }
  case 'quiz': { const ans=f.items.filter((q,i)=>v['f'+i]!=null); const r=f.items.filter((q,i)=>v['f'+i]===q.a); const miss=f.items.filter((q,i)=>v['f'+i]!=null&&v['f'+i]!==q.a);
    return `<b>${r.length} of ${ans.length} right on the first try</b> (${ans.length?Math.round(r.length/ans.length*100):0}%)${miss.length?`<br>Missed: ${esc(miss.map(q=>q.q).join(' · '))}`:''}`; }
  }
  return esc(JSON.stringify(v));
}
function entryBody(e){
  if(e.type==='page'){ const p=PAGES[e.data.page]; if(!p||!p.fields) return '';
    let extra=''; if(e.data.page==='bst'){ const c=+e.data.v.correct||0, t=+e.data.v.total||0; extra=`${t?`<p><b>Caregiver accuracy: ${c}/${t} (${Math.round(c/t*100)}%)</b></p>`:''}<p class="note">${e.ack?`Parent reviewed ✓ ${when(e.ack)}${e.ackBy?' · '+esc(e.ackBy):''}`:'Not reviewed by the parent yet'}</p>`; }

  if(e.type==='tally'){ const gs=e.data.goals||[]; const all=gs.filter(g=>g.t0).map(g=>[g.t0,g.t1||g.t0]); const span=all.length?(Math.max(...all.map(x=>x[1]))-Math.min(...all.map(x=>x[0])))/60000:null; const tot=gs.reduce((s,g)=>s+g.n,0);
    return `<dl class="kv">${gs.map(g=>`<dt>${esc(g.name||g.code)}</dt><dd>${g.ok}/${g.n} trials${g.t0?` · ${clock(g.t0)}–${clock(g.t1||g.t0)}`:''}</dd>`).join('')}</dl>${span!=null?`<p class="note">${tot} trials recorded over ${Math.round(span)} min.${tot>=10&&span<3?' <b>Most trials were logged within a few minutes. Check whether data was recorded live.</b>':''}</p>`:''}<span class="note">Raw trials were entered in CentralReach.</span>`; }
  if(e.type==='story') return `<p class="note">He read "${esc(e.data.title||'')}".</p>`;
  if(e.type==='wrap') return `<dl class="kv">${wrapKV(e.data)}</dl>${(e.data.run<e.data.need||e.data.short)?'<p class="note"><b>Goal requirements weren\'t met this session.</b></p>':''}`;
  if(e.type==='milestone') return '<p class="note">Every step on the schedule was finished.</p>';
  if(isPts(e)) return `<p class="note">${e.type==='save'?`${e.data.n} points moved to Saved`:`${e.data.d>0?'+':''}${e.data.d} points`}</p>`;
  return '';
}
function entryCard(e){

let pFilter='notes', pRange=14;
function viewProgress(){
  const now=Date.now(), wk=now-7*864e5;
  const recent=E.filter(e=>e.t>=wk);
  const earned=recent.filter(e=>e.type==='points'&&e.data.d>0).reduce((a,e)=>a+e.data.d,0);
  const days=new Set(recent.filter(isPts).map(e=>new Date(e.t).toDateString())).size;
  const kidPages=recent.filter(e=>e.type==='page'&&e.role==='kid').length;
  const abc=recent.filter(e=>e.type==='page'&&(e.data.page==='abc'||e.data.page==='pabc')).length;
  const parent=recent.filter(e=>e.role==='parent'&&e.type==='page').length;
  const unrev=E.filter(e=>!e.reviewed&&!isPts(e)).length;
  // chart: points earned per day
  const N=pRange, dayKeys=[]; for(let i=N-1;i>=0;i--){ const d=new Date(now-i*864e5); dayKeys.push(d.toDateString()); }
  const sums=dayKeys.map(k=>E.filter(e=>e.type==='points'&&e.data.d>0&&new Date(e.t).toDateString()===k).reduce((a,e)=>a+e.data.d,0));
  const max=Math.max(50, ...sums), W=Math.max(320,N*24), H=150, pl=30, pb=22, bw=(W-pl-6)/N;
  const ticks=[0, Math.round(max/2), max];
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points earned per day, last ${N} days">
    ${ticks.map(t=>{ const y=H-pb-(t/max)*(H-pb-10); return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-opacity=".18"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`; }).join('')}
    ${sums.map((s,i)=>{ const h=(s/max)*(H-pb-10), x=pl+i*bw+bw*0.15, y=H-pb-h; const d=new Date(dayKeys[i]);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="3" fill="var(--teal)"><title>${d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}: ${s} points</title></rect>${s?`<text x="${(x+bw*0.35).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">${s}</text>`:''}${(i%(N<=14?2:5)===(N-1)%(N<=14?2:5))?`<text x="${(x+bw*0.35).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.getMonth()+1}/${d.getDate()}</text>`:''}`; }).join('')}
  </svg>`;
  const therm=E.filter(e=>e.type==='page'&&e.data.page==='thermo'&&e.data.v.level).slice(0,10).reverse();
  const filt={notes:e=>!isPts(e), kid:e=>e.role==='kid'&&!isPts(e), bt:e=>e.role==='bt', parent:e=>e.role==='parent'&&!isPts(e), points:isPts, unrev:e=>!e.reviewed&&!isPts(e)}[pFilter];
  const list=E.filter(filt).slice(0,150); const groups=[]; list.forEach(e=>{ const k=new Date(e.t).toDateString(); const g=groups[groups.length-1]; if(g&&g.k===k) g.items.push(e); else groups.push({k,items:[e]}); });
  const fid=E.filter(e=>e.type==='page'&&e.data.page==='fidelity').slice(0,5);
  const fidPct=e=>{ let y=0,t=0; PAGES.fidelity.fields.filter(f=>f.k==='check').forEach(f=>{ Object.values(e.data.v[f.id]||{}).forEach(x=>{ t++; y+= x===2?1:(x===1?0.5:0); }); }); return t?Math.round(y/t*100):null; };
  return {back:'home', backLabel:'Home', title:'Progress', body:`
  <a class="card row" href="#bcba/main" style="color:inherit;text-decoration:none;background:var(--plum-soft)"><span class="grow"><b>BCBA Setup</b><br><span class="note">Control what the BT sees: goals, points, rewards, presets and ideas</span></span><span class="pill">Open</span></a>
  <div class="card stack"><label class="fld"><b>This week's focus for the BT</b><textarea id="focusIn" data-set="focus" maxlength="600" placeholder="Shows at the top of the BT section. Example: Thin the timer to about 5 minutes. Run SO3b during chess.">${esc(S.focus)}</textarea></label><span class="note">Saves when you tap outside the box.</span></div>
  <div class="row wrap"><a class="btn primary" href="#bcba/fidelity" style="text-decoration:none">Start a fidelity check</a>${fid.length?`<span class="note">Recent: ${fid.map(e=>`${fidPct(e)}% (${new Date(e.t).getMonth()+1}/${new Date(e.t).getDate()})`).join(' · ')}</span>`:''}</div>
  <div class="stats">
    <div class="stat"><b>${earned}</b><span>points earned, 7 days</span></div>
    <div class="stat"><b>${days}</b><span>days with sessions</span></div>
    <div class="stat"><b>${kidPages}</b><span>pages ${esc(playerName())} saved</span></div>
    <div class="stat"><b>${abc}</b><span>ABC notes</span></div>
    <div class="stat"><b>${parent}</b><span>parent entries</span></div>
    <div class="stat"><b>${unrev}</b><span>not reviewed</span></div>
  </div>
  <div class="row" style="justify-content:space-between"><h2>Points earned per day</h2><div class="chips">${[14,30].map(n=>`<button class="chip ${pRange===n?'on':''}" data-a="prange" data-v="${n}">${n} days</button>`).join('')}</div></div>
  <div class="chartbox">${svg}</div>
  ${therm.length?`<h2>Feelings check-ins</h2><div class="chips">${therm.map(e=>{ const o=LEVELS.find(l=>l.v===e.data.v.level); return `<span class="chip" title="${esc(o?o.label:'')}"><i style="width:18px;height:18px;border-radius:50%;background:${o?o.c:'#ccc'};border:1.5px solid var(--line);display:inline-block"></i>${e.data.v.level} · ${new Date(e.t).getMonth()+1}/${new Date(e.t).getDate()}</span>`; }).join('')}</div>`:''}
  <div class="row wrap" style="justify-content:space-between"><h2>History</h2>${unrev?`<button class="btn small" data-a="revall">Mark all reviewed</button>`:''}</div>
  <div class="chips">${[['notes','Everything'],['unrev','Not reviewed'],['kid',playerName()+'\'s pages'],['bt','BT'],['parent','Parents'],['points','Points']].map(([k,l])=>`<button class="chip ${pFilter===k?'on':''}" data-a="pfilter" data-v="${k}">${esc(l)}</button>`).join('')}</div>
  ${groups.length?groups.map(g=>`<div class="day">${new Date(g.k).toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'})}</div><div class="stack">${g.items.map(entryCard).join('')}</div>`).join(''):'<div class="empty">Nothing here yet. Pages, notes and summaries show up as they are saved.</div>'}
  <div class="row wrap"><a class="btn" href="#setup" style="text-decoration:none">Setup: name, PIN, account</a><a class="btn" href="#bt/btsetup" style="text-decoration:none">Points, rewards and goals</a></div>`};
}

/* ================= confetti ================= */
function confetti(n, from){
  try{ if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cv=document.createElement('canvas'); cv.className='confetti'; const W=cv.width=innerWidth, H=cv.height=innerHeight; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'); const cols=['#127A7A','#F2B632','#C2561A','#5B4B8A','#3E9B5B','#E57B2E'];
  let ox=W/2, oy=H*0.35; if(from&&from.width){ ox=from.left+from.width/2; oy=from.top+from.height/2; }
  const P=Array.from({length:n},()=>({x:ox,y:oy,vx:(Math.random()-0.5)*(n>100?14:9),vy:-Math.random()*(n>100?13:8)-2,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-0.5)*0.4}));
  const t0=performance.now();
  (function f(t){ const k=(t-t0)/1400; ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=0.35; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.globalAlpha=Math.max(0,1-k); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66); ctx.restore(); });
    if(k<1) requestAnimationFrame(f); else cv.remove(); })(t0);
}

function addPts(n, note, role, check){ const room=goalMax()-todayStats().earned; if(room<=0){ toast(`${goalMax()} points reached today! Keep the praise coming.`); return false; } if(n>room){ n=room; }
  Store.incr(['now'],n); Store.add({type:'points', role, title:note, data:{d:n, check:!!check}}); const c=$('coinNow'); if(c){ c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } toast(`+${n} for ${note}`); }
function addToList(listKey, item){ Store.patch({[listKey]: S[listKey].concat([item])}); }

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, d=b.dataset, r=route();
  const pid = r.sec==='kid' ? r.id : r.id; // current page id
  switch(a){

  case 'rerender': render(); break;
  /* pin */
  case 'pin': if(d.k==='⌫') pinTry=pinTry.slice(0,-1); else if(pinTry.length<4) pinTry+=d.k;
    if(pinTry.length===4){ if(pinTry===S.pin){ unlocked=true; pinTry=''; render(); return; } pinTry=''; toast('That PIN didn\'t match'); }

  case 'sched': { const rect=b.getBoundingClientRect(); const before=S.sched.length&&S.sched.every(s=>s.done); const arr=S.sched.map(x=>Object.assign({},x)); arr[+d.i].done=!arr[+d.i].done; Store.patch({sched:arr});

  case 'newday': Store.patch({sched:S.sched.map(x=>Object.assign({},x,{done:false}))}); toast('Every step is back to To do'); break;
  case 'schedadd': { const t=$('schedIn').value.trim(); if(!t){ $('schedIn').focus(); break; } const time=$('schedTime').value||'', m=Math.max(0,Math.min(180,parseInt($('schedMin').value)||0)), ty=$('schedType').value, p=Math.max(0,Math.min(50,parseInt($('schedPts').value)||0));
    lastSchedTime = time&&m ? addMin(time,m) : time; Store.patch({sched:sortSched(S.sched.concat([{time,min:m,type:ty,block:BLOCKS[ty],act:t.slice(0,100),pts:p,done:false}]))}); break; }
  case 'schmove': { const i=+d.i, j=i+(+d.dir); if(j<0||j>=S.sched.length) break; const arr=S.sched.map(x=>Object.assign({},x)); const first=arr[0].time; [arr[i],arr[j]]=[arr[j],arr[i]]; if(first) arr[0].time=first; Store.patch({sched:retime(arr)}); break; }
  case 'secgo': { if(d.id!=='secnav'&&d.id!=='app'){ openDet.add(d.id); render(); } const el=$(d.id); if(el){ const y=el.getBoundingClientRect().top+window.scrollY-90; window.scrollTo({top:Math.max(0,y),behavior:'smooth'}); } break; }

  case 'timertoggle': { const on=!timerOn(); if(!on){ stopTimer(); alerting=false; } Store.patch({timerOn:on}); toast(on?'Check-in timer is on for this session':'Check-in timer is off for this session'); if(!on && route().id==='timer') go('kid/today'); break; }
  case 'schedit': editIdx=+d.i; render(); break;
