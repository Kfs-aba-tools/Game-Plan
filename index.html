  case 'lck': { const dd=D(pid); const g=dd[d.f]=dd[d.f]||{text:[],ck:[]}; g.ck[d.i]=!g.ck[d.i]; saveDrafts(); render(); break; }
  case 'quiz': { const dd=D(pid); const g=dd[d.f]=dd[d.f]||{}; g[d.i]=+d.v; if(g['f'+d.i]==null) g['f'+d.i]=+d.v; saveDrafts(); render(); break; }
  case 'rank': { const dd=D(pid); const arr=(dd[d.f]||[]).slice(); const i=arr.indexOf(d.v); if(i>=0) arr.splice(i,1); else if(arr.length<3) arr.push(d.v); else { toast('Pick 3. Tap one to remove it.'); break; } dd[d.f]=arr; saveDrafts(); render(); break; }
  case 'optopen': addingKey=pid+'.'+d.f; render(); setTimeout(()=>{ const el=$('own-'+d.f); if(el) el.focus(); },30); break;
  case 'optcancel': addingKey=''; render(); break;
  case 'optadd': { const el=$('own-'+d.f); const t=(el&&el.value||'').trim(); if(!t){ el&&el.focus(); break; } if(el) el.blur(); const ck=pid+'.'+d.f; const co=Object.assign({},S.customOpts||{}); const list=(co[ck]||[]).slice(); if(!list.includes(t)) list.push(t.slice(0,40)); co[ck]=list;
    const dd=D(pid); if(d.m==='1'){ const arr=(dd[d.f]||[]).slice(); if(!arr.includes(t)) arr.push(t); dd[d.f]=arr; } else dd[d.f]=t; saveDrafts(); addingKey=''; Store.patch({customOpts:co}); toast('Added: '+t); break; }
  case 'optdel': { const ck=pid+'.'+d.f; const co=Object.assign({},S.customOpts||{}); co[ck]=(co[ck]||[]).filter(o=>o!==d.v); const dd=D(pid); if(Array.isArray(dd[d.f])) dd[d.f]=dd[d.f].filter(o=>o!==d.v); else if(dd[d.f]===d.v) dd[d.f]=''; saveDrafts(); Store.patch({customOpts:co}); break; }
  case 'deal': { const f=PAGES[pid].fields.find(x=>x.id===d.f); const shuffle=arr=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
    const pick=shuffle(f.cards.map((_,i)=>i)).slice(0,+d.n); const perm=pick.map(ci=>{ const o=f.cards[ci].opts.map((_,j)=>j); return f.fixed?o:shuffle(o); });
    D(pid)[d.f]={pick,perm,i:0,first:{},last:{}}; saveDrafts(); render(); break; }
  case 'dans': { const g=D(pid)[d.f]; if(!g) break; const rect=b.getBoundingClientRect(); g.last[g.i]=+d.v; if(g.first[g.i]==null) g.first[g.i]=+d.v; saveDrafts(); render();
    const f=PAGES[pid].fields.find(x=>x.id===d.f); if(+d.v===f.cards[g.pick[g.i]].a) confetti(25,rect); break; }
  case 'dnext': { const g=D(pid)[d.f]; if(!g) break; g.i++; saveDrafts(); render(); if(g.i>=g.pick.length) confetti(120); break; }
  case 'dreset': { delete D(pid)[d.f]; saveDrafts(); render(); break; }
  case 'topicdraw': { const T=libTopics(); const dd=D(pid); const cur=dd[d.f]&&dd[d.f].i; let n; do{ n=Math.floor(Math.random()*T.length); }while(n===cur&&T.length>1); dd[d.f]={i:n}; saveDrafts(); render(); break; }
  case 'turn': { const dd=D(pid); const arr=Array.isArray(dd[d.f])?dd[d.f].slice():[]; arr.push(d.v); dd[d.f]=arr; saveDrafts(); const rect=b.getBoundingClientRect(); render(); if(d.v==='m'&&arr[arr.length-2]==='p') confetti(20,rect); break; }
  case 'turnundo': { const dd=D(pid); const arr=Array.isArray(dd[d.f])?dd[d.f].slice():[]; arr.pop(); dd[d.f]=arr; saveDrafts(); render(); break; }
  case 'cnt': { const dd=D(pid); dd[d.f]=Math.max(0,(dd[d.f]||0)+(+d.v)); saveDrafts(); render(); break; }
  case 'save': { const p=PAGES[d.p], dd=D(d.p); if(!Object.values(dd).some(hasVal)){ toast('Fill in at least one part first'); break; }
    Store.add({type:'page', role:d.role, title:p.title, data:{page:d.p, v:JSON.parse(JSON.stringify(dd))}});
    if(d.p==='prefs' && dd.top && dd.top[0]) Store.patch({target:dd.top[0]}); drafts[d.p]={}; saveDrafts(); render(); window.scrollTo(0,0);
    toast(d.role==='kid'?'Saved. Nice work!':'Saved'); if(d.role==='kid') confetti(90); break; }
  case 'clear': drafts[d.p]={}; saveDrafts(); render(); break;
  /* bt */
  case 'draw': { let n; do{ n=Math.floor(Math.random()*libTopics().length); }while(n===topicIdx && libTopics().length>1); topicIdx=n; render(); break; }
  case 'tal': { const now=Date.now(); const cur=(S.tally||{})[d.c]||{}; if((+cur.n||0)>=TR_MAX){ toast(`${TR_MAX} trials max for this goal. Move to another goal.`); break; } if(!cur.t0) Store.setPath(['tally',d.c,'t0'],now); Store.setPath(['tally',d.c,'t1'],now); Store.incr(['tally',d.c,'n'],1); if(d.ok==='1') Store.incr(['tally',d.c,'ok'],1); talStack.push([d.c,d.ok==='1']); break; }
  case 'talundo': { const t=talStack.pop(); if(!t){ toast('Nothing to undo'); break; } Store.incr(['tally',t[0],'n'],-1); if(t[1]) Store.incr(['tally',t[0],'ok'],-1); toast('Undone'); break; }
  case 'crask': { const T=S.tally||{}; const run=S.goals.filter(g=>(+(T[gkey(g)]||{}).n||0)>=TR_MIN).length, short=S.goals.filter(g=>{ const n=+(T[gkey(g)]||{}).n||0; return n>0&&n<TR_MIN; }).length, need=goalsNeeded();
    const warn = (run<need?`<span class="note"><b>Only ${run} of ${need} goals have ${TR_MIN}+ trials.</b> Insurance needs at least 2 goals per hour.</span>`:'') + (short?`<span class="note"><b>${short} goal${short>1?'s have':' has'} fewer than ${TR_MIN} trials.</b></span>`:'');
    $('crConfirm').innerHTML=`<div class="card confirm stack"><b>Entered every trial in CentralReach?</b>${warn}<span class="note">This clears the tally for next session and adds a note to the history.</span><div class="row"><button class="btn primary" data-a="crok">Yes, clear it</button><button class="btn" data-a="cancel" data-t="crConfirm">Not yet</button></div></div>`; break; }
  case 'crok': { const T=S.tally||{}; const goals=S.goals.map(g=>{ const t=T[gkey(g)]||{}; return {name:g.name,ok:+t.ok||0,n:+t.n||0,t0:t.t0||null,t1:t.t1||null}; }).filter(g=>g.n>0);
    Store.add({type:'tally', role:'bt', title:`Goal data entered in CR (${goals.length} goals)`, data:{goals}}); Store.patch({tally:{}}); talStack=[]; toast('Tally cleared'); break; }
  /* history */
  case 'fopen': case 'fdl': { const id=d.id, f=FILES.find(x=>x.id===id); toast('Opening…'); getBlob(id).then(bl=>{ if(!bl){ toast('File not found'); return; } const url=URL.createObjectURL(bl); const l=document.createElement('a'); l.href=url; if(a==='fdl') l.download=f?f.name:'file'; else { l.target='_blank'; l.rel='noopener'; } document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); }).catch(()=>toast('Couldn\'t open the file')); break; }
  case 'fdelask': $('fdel-'+d.id).innerHTML=`<div class="card confirm row wrap"><span class="grow">Delete this file for everyone?</span><button class="btn small primary" data-a="fdel" data-id="${d.id}">Delete</button><button class="btn small" data-a="cancel" data-t="fdel-${d.id}">Keep</button></div>`; break;
  case 'fdel': delFile(d.id); break;
  case 'wsave': { const n=S.now; if(n<=0) break; Store.incr(['saved'],n); Store.incr(['now'],-n); Store.add({type:'save', role:'kid', title:`Saved ${n} points for later`, data:{n}}); toast(`${n} points saved`); break; }
  case 'wcr': wrapCR=!wrapCR; render(); break;
  case 'wrapreset': wrapDone=null; break;
  case 'wfinish': { const w=wrapStats(); const miss=[]; if(w.run<w.need||w.short) miss.push('goal requirements'); if(w.trials&&!wrapCR){ $('wrapWarn').innerHTML='<div class="card confirm"><b>Enter the trials in CR first, then check the box in step 4.</b></div>'; break; }
    if(miss.length && d.force!=='1'){ $('wrapWarn').innerHTML=`<div class="card confirm stack"><b>Not done yet: ${esc(miss.join(', '))}.</b><span class="note">Finish anyway? Your BCBA will see what was missed.</span><div class="row"><button class="btn primary" data-a="wfinish" data-force="1">Finish anyway</button><button class="btn" data-a="cancel" data-t="wrapWarn">Go back</button></div></div>`; break; }
    wrapFinish(); break; }
  case 'libtab': libTab=d.v; render(); break;
  case 'libaddgoal': { const n=$('lgNew').value.trim(); if(!n){ $('lgNew').focus(); break; } const L=clone(libGoals()); const id=uid(); L.push({id,code:'',name:n.slice(0,80),type:$('lgNewT').value,how:''}); openDet.add('lg-'+id); libSet('goals',L); toast('Preset added. Fill in how to run it.'); break; }
  case 'libdel': { if(d.ok!=='1'){ $('libConfirm').innerHTML=`<div class="card confirm row wrap"><span class="grow">Delete this ${d.kind==='goals'?'goal preset':'item'}?</span><button class="btn small primary" data-a="libdel" data-kind="${d.kind}" data-i="${d.i}" data-ok="1">Delete</button><button class="btn small" data-a="cancel" data-t="libConfirm">Keep</button></div>`; $('libConfirm').scrollIntoView({block:'nearest'}); break; }
    const src={goals:libGoals,rates:libRates,topics:libTopics}[d.kind](); const L=clone(src); L.splice(+d.i,1); libSet(d.kind,L); toast('Deleted'); break; }
  case 'libdelitem': { const G=clone(d.kind==='earn'?libEarn():libRew()); G[+d.g].items.splice(+d.i,1); libSet(d.kind,G); break; }
  case 'libdelgrp': { if(d.ok!=='1'){ $('libConfirm').innerHTML=`<div class="card confirm row wrap"><span class="grow">Delete this whole group?</span><button class="btn small primary" data-a="libdelgrp" data-kind="${d.kind}" data-g="${d.g}" data-ok="1">Delete</button><button class="btn small" data-a="cancel" data-t="libConfirm">Keep</button></div>`; $('libConfirm').scrollIntoView({block:'nearest'}); break; }
    const G=clone(d.kind==='earn'?libEarn():libRew()); G.splice(+d.g,1); libSet(d.kind,G); break; }
  case 'libadditem': { const t=$('lgnew'+d.g).value.trim(); if(!t){ $('lgnew'+d.g).focus(); break; } const G=clone(d.kind==='earn'?libEarn():libRew()); G[+d.g].items.push([t.slice(0,80),Math.max(1,Math.min(999,+$('lgnewp'+d.g).value||1))]); libSet(d.kind,G); toast('Added'); break; }
  case 'libaddgrp': { const t=$('lgNewGrp').value.trim(); if(!t){ $('lgNewGrp').focus(); break; } const G=clone(d.kind==='earn'?libEarn():libRew()); G.push({g:t.slice(0,60),items:[]}); libSet(d.kind,G); break; }
  case 'libaddrate': { const t=$('lrNew').value.trim(); if(!t){ $('lrNew').focus(); break; } libSet('rates',clone(libRates()).concat([t.slice(0,60)])); break; }
  case 'libaddtopic': { const t=$('ltNewT').value.trim(), q=$('ltNewQ').value.trim(); if(!t||!q){ toast('Add a topic and a starter question'); break; } libSet('topics',clone(libTopics()).concat([[t.slice(0,40),q.slice(0,160)]])); break; }
  case 'libreset': { if(d.ok!=='1'){ $('libConfirm').innerHTML=`<div class="card confirm row wrap"><span class="grow">Reset this list to the built-in version? Your edits to it will be lost.</span><button class="btn small primary" data-a="libreset" data-kind="${d.kind}" data-ok="1">Reset</button><button class="btn small" data-a="cancel" data-t="libConfirm">Keep</button></div>`; break; }
    const lib=Object.assign({},S.lib||{}); delete lib[d.kind]; Store.patch({lib}); toast('Reset to built-in'); break; }
  case 'storyread': { const f=FILES.find(x=>x.id===d.id); if(!f) break; const rect=b.getBoundingClientRect(); Store.add({type:'story', role:'kid', title:'Read a social story: '+ftitle(f), data:{id:f.id, title:ftitle(f)}}); confetti(60,rect); toast('Nice reading!'); break; }
  case 'hubopen': hubMsg=''; selectClient(d.id); break;
  case 'hubadd': hubAdd=!hubAdd; hubMsg=''; render(); break;
  case 'hubcreate': createClient(); break;
  case 'hubedit': hubEdit = hubEdit===d.id ? null : d.id; render(); break;
  case 'hubsave': saveClientMeta(d.id); break;
  case 'hublink': { const l=clientLink(d.id); try{ navigator.clipboard.writeText(l).then(()=>toast('Link copied'),()=>{ hubEdit=d.id; render(); toast('Copy the link from the box'); }); }catch(e){ hubEdit=d.id; render(); } break; }
  case 'simode': siMode=d.v; siState=''; render(); break;
  case 'sigoogle': { const prov=new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
    firebase.auth().signInWithPopup(prov).catch(x=>{ if(/popup-blocked|operation-not-supported/.test(x.code||'')) firebase.auth().signInWithRedirect(prov); else if($('siErr')) $('siErr').textContent=siErrMsg(x); }); break; }
  case 'ack': Store.upd(d.id,{ack:Date.now(), ackBy:me}); toast('Thanks! Your BCBA will see it.'); break;
  case 'eopen': openEntries.has(d.id)?openEntries.delete(d.id):openEntries.add(d.id); render(); break;
  case 'erev': { const x=E.find(x=>x.id===d.id); if(x) Store.upd(d.id,{reviewed:!x.reviewed}); break; }
  case 'edelask': $('del-'+d.id).innerHTML=`<div class="card confirm row wrap"><span class="grow">Delete this entry for everyone?</span><button class="btn small primary" data-a="edel" data-id="${d.id}">Delete</button><button class="btn small" data-a="cancel" data-t="del-${d.id}">Keep</button></div>`; break;
  case 'edel': Store.del(d.id); toast('Deleted'); break;
  case 'revall': E.filter(x=>!x.reviewed&&!isPts(x)).forEach(x=>Store.upd(x.id,{reviewed:true})); toast('All marked reviewed'); break;
  case 'pfilter': pFilter=d.v; render(); break;
  case 'prange': pRange=+d.v; render(); break;
  /* setup */
  case 'earnadd': { const t=$('earnIn').value.trim(); if(!t){ $('earnIn').focus(); break; } const it={text:t.slice(0,80),pts:Math.max(1,Math.min(50,+$('earnPts').value||1))}; if(!earnCheck(S.earn.concat([it]))) break; addToList('earn',it); break; }
  case 'rewadd': { const t=$('rewIn').value.trim(); if(!t){ $('rewIn').focus(); break; } addToList('rewards',{text:t.slice(0,80),cost:Math.max(1,Math.min(999,+$('rewPts').value||1))}); break; }
  case 'idea': { const src=d.k==='e'?libEarn():libRew(); const [t,p]=src[+d.g].items[+d.i]; if(d.k==='e'&&!earnCheck(S.earn.concat([{text:t,pts:p}]))) break; d.k==='e'?addToList('earn',{text:t,pts:p}):addToList('rewards',{text:t,cost:p}); toast('Added: '+t); break; }
  case 'listdel': Store.patch({[d.l]:S[d.l].filter((_,i)=>i!==+d.i)}); break;
  case 'goaladd': { const n=$('goalName').value.trim(); if(!n){ $('goalName').focus(); break; }
    if(S.goals.some(g=>(g.name||'').toLowerCase()===n.toLowerCase())){ toast('That goal is already added'); break; } addToList('goals',{id:uid(),name:n.slice(0,80),type:$('goalType').value,how:''}); break; }
  case 'goalpreset': { const g=libGoals()[+d.i]; addToList('goals',{id:uid(),pid:g.id,code:g.code||'',name:g.name,type:g.type,how:''}); toast('Added: '+g.name); break; }
  case 'rateitem': { const cur=(S.rateItems||[]).slice(); const i=cur.indexOf(d.v); if(i>=0) cur.splice(i,1); else { if(cur.length>=8){ toast('Pick up to 8'); break; } cur.push(d.v); } Store.patch({rateItems:cur}); break; }
  case 'rateadd': { const t=$('rateIn').value.trim(); if(!t){ $('rateIn').focus(); break; } const cur=(S.rateItems||[]).slice(); if(cur.length>=8){ toast('Pick up to 8'); break; } if(!cur.includes(t)) cur.push(t.slice(0,50)); Store.patch({rateItems:cur}); break; }
  case 'pinset': { const v=$('pinIn').value.trim(); if(!/^\d{4}$/.test(v)){ toast('Use exactly 4 digits'); break; } Store.patch({pin:v}); unlocked=true; toast('PIN saved'); break; }
  case 'pinclear': Store.patch({pin:''}); toast('PIN removed'); break;
  case 'signout': try{ localStorage.removeItem(LS_CUR); }catch(e){} firebase.auth().signOut(); unlocked=false; location.hash='home'; break;
  case 'backup': { const blob=new Blob([JSON.stringify({state:S,entries:E},null,2)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(blob); l.download='game-plan-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(l.href),1500); toast('Backup saved'); break; }
  case 'resetask': $('resetBox').innerHTML=`<div class="card confirm stack"><b>Clear all points, lists, pages and history on this device?</b><span class="note">Back up first if you might want it later.</span><div class="row"><button class="btn primary" data-a="resetok">Yes, clear</button><button class="btn" data-a="rerender">Cancel</button></div></div>`; break;
  case 'resetok': S=blankState(); E=[]; drafts={}; lsSet(KS(),S); lsSet(KE(),E); saveDrafts(); unlocked=false; toast('Cleared'); go('home'); break;
  }
});

/* text inputs */
document.addEventListener('input', e=>{
  const t=e.target, d=t.dataset, r=route();
  if(d.in){ D(r.id)[d.in]=t.value; saveDrafts(); }
  else if(d.list){ const dd=D(r.id); const g=dd[d.list]=dd[d.list]||{text:[],ck:[]}; g.text[+d.i]=t.value; saveDrafts(); }
});
document.addEventListener('change', e=>{
  const t=e.target, d=t.dataset;
  if(d.set==='name'){ Store.patch({name:t.value.trim().slice(0,20)}); }
  else if(d.set==='appName'){ Store.patch({appName:t.value.trim().slice(0,30)}); }
  else if(d.set==='focus'){ Store.patch({focus:t.value.trim().slice(0,600)}); toast('Focus saved'); }
  else if(d.set==='sessionHours'){ const v=parseFloat(t.value); Store.patch({sessionHours: v>0?Math.min(8,v):0}); toast(v>0?'Session length saved':'Using today\'s schedule'); }
  else if(d.set==='goal'){ Store.patch({goal:Math.max(10,Math.min(200,+t.value||50))}); toast('Session max saved'); }
  else if(d.set==='checkPts'){ Store.patch({checkPts:Math.max(1,Math.min(10,+t.value||1))}); }
  else if(d.ed){ const arr=S[d.ed].map(x=>Object.assign({},x)); const it=arr[+d.i]; if(!it) return; let v=t.value;
    if(d.k==='pts') v=Math.max(1,Math.min(50,+v||1)); else if(d.k==='cost') v=Math.max(1,Math.min(999,+v||1)); else if(d.k==='name'){ v=v.trim(); if(!v) return; } else if(d.k==='text'){ v=v.trim(); if(!v) return; } else if(d.k==='how'){ v=v.trim().slice(0,2500); }
    it[d.k]=v; if(d.ed==='earn'&&d.k==='pts'&&!earnCheck(arr)){ t.value=S.earn[+d.i].pts; return; } Store.patch({[d.ed]:arr}); toast('Saved'); }
  else if(d.lib){ const kind=d.lib; let v=t.value;
    if(kind==='goals'){ const L=clone(libGoals()); const p=L[+d.i]; if(!p) return; const old=Object.assign({},p);
      if(d.k==='name'){ v=v.trim(); if(!v) return; } if(d.k==='how') v=v.trim().slice(0,2500); p[d.k]=v; libSet('goals',L);
      if(['name','type'].includes(d.k)){ const gs=S.goals.map(g=>{ if((g.pid&&g.pid===p.id)||(!g.pid&&g.name===old.name)) return Object.assign({},g,{[d.k]:v,pid:p.id}); return g; }); if(JSON.stringify(gs)!==JSON.stringify(S.goals)) Store.patch({goals:gs}); }
      toast('Preset saved'); }
    else if(kind==='earn'||kind==='rew'){ const G=clone(kind==='earn'?libEarn():libRew()); if(d.k==='group'){ v=v.trim(); if(!v) return; G[+d.g].g=v; } else { const it=G[+d.g].items[+d.i]; if(d.k==='text'){ v=v.trim(); if(!v) return; it[0]=v; } else it[1]=Math.max(1,Math.min(999,+v||1)); } libSet(kind,G); toast('Saved'); }
    else if(kind==='rates'){ v=v.trim(); if(!v) return; const L=clone(libRates()); L[+d.i]=v.slice(0,60); libSet('rates',L); toast('Saved'); }
    else if(kind==='topics'){ v=v.trim(); if(!v) return; const L=clone(libTopics()); L[+d.i][+d.k]=v; libSet('topics',L); toast('Saved'); }
  }
  else if(t.id==='fileIn'){ const fs=[...t.files]; t.value=''; (async()=>{ for(const f of fs) await addFile(f); })(); }
  else if(t.id==='storyIn'){ const fs=[...t.files]; t.value=''; (async()=>{ for(const f of fs) await addFile(f,'story'); })(); }
  else if(d.ftitle){ const v=t.value.trim(); if(v) renameFile(d.ftitle, v.slice(0,80)); }
  else if(t.id==='restoreIn'){ const f=t.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result); if(!j.state||!Array.isArray(j.entries)) throw 0; S=Object.assign(blankState(),j.state); E=j.entries; lsSet(KS(),S); lsSet(KE(),E); toast('Restored'); render(); }catch(err){ toast('That file is not a Game Plan backup'); } t.value=''; }; rd.readAsText(f); }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return; const id=e.target.id; const ownEl=e.target.id&&e.target.id.startsWith('own-'); if(ownEl){ e.preventDefault(); const b=document.querySelector('[data-a="optadd"]'); if(b) b.click(); return; }
  const map={schName:'schsaveas',parkIn:'parkadd',schedIn:'schedadd',earnIn:'earnadd',rewIn:'rewadd',goalName:'goaladd'};
  if(map[id]){ e.preventDefault(); const b=document.querySelector(`[data-a="${map[id]}"]`); if(b) b.click(); }
});
document.addEventListener('submit', e=>{
  const id=e.target.id; if(!['signin','silink','sifinish'].includes(id)) return; e.preventDefault();
  const err=t=>{ if($('siErr')) $('siErr').textContent=t; };
  if(id==='signin'){ err('Signing in…'); firebase.auth().signInWithEmailAndPassword($('siEmail').value.trim(), $('siPass').value).catch(x=>err(siErrMsg(x))); }
  if(id==='silink'){ const em=$('slEmail').value.trim(); err('Sending…');
    const url=location.origin+location.pathname;
    firebase.auth().sendSignInLinkToEmail(em,{url, handleCodeInApp:true}).then(()=>{ try{ localStorage.setItem('gp2-signin-email',em); }catch(x){} siState='sent'; render(); }).catch(x=>err(siErrMsg(x))); }
  if(id==='sifinish'){ const em=$('sfEmail').value.trim(); err('Signing in…'); finishEmailLink(em); }
});
function finishEmailLink(em){
  firebase.auth().signInWithEmailLink(em, location.href).then(()=>{ try{ localStorage.removeItem('gp2-signin-email'); }catch(x){} siNeedEmail=false; history.replaceState(null,'',location.pathname+'#home'); }).catch(x=>{ siNeedEmail=false; history.replaceState(null,'',location.pathname+'#home'); render(); toast(siErrMsg(x)); });
}


/* ================= boot ================= */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
const DATA_VER='2026-10-22-multi';
function clearOldTestData(){ try{ if(localStorage.getItem('gp2-ver')===DATA_VER) return; ['gp2-drafts','gp2-state','gp2-entries'].forEach(k=>localStorage.removeItem(k)); localStorage.setItem('gp2-ver',DATA_VER); }catch(e){} }
function hashClient(){ const h=location.hash||''; if(h.startsWith('#@')){ const id=h.slice(2).split('/')[0]; return id||null; } return null; }
function isBcbaUser(){ return Store.mode!=='remote' || (user && BCBAS.includes((user.email||'').toLowerCase())); }
function myRole(){ if(Store.mode!=='remote') return 'bcba'; if(isBcbaUser()) return 'bcba'; const em=(user&&user.email||'').toLowerCase(); if(CMETA&&(CMETA.bt||[]).map(x=>x.toLowerCase()).includes(em)) return 'bt'; if(CMETA&&(CMETA.parent||[]).map(x=>x.toLowerCase()).includes(em)) return 'parent'; return 'bt'; }
const ROLE_SECS = {bcba:['home','kid','bt','parent','bcba','setup'], bt:['home','kid','bt'], parent:['home','kid','parent']};
function loadClientsLocal(){ CLIENTS=(lsGet(LS_CLIENTS)||[]); try{ if(!CLIENTS.length && !localStorage.getItem('gp2-seeded')){ localStorage.setItem('gp2-seeded','1'); const id='jacob-'+Math.random().toString(36).slice(2,6); CLIENTS=[{id,name:'Jacob',active:true,bt:[],parent:[],members:[],created:Date.now(),starter:true}]; saveClientsLocal(); lsSet('gp2-c-'+id+'-state',{name:'Jacob',appName:'Jacob\'s Game Plan'}); } }catch(e){} }
function saveClientsLocal(){ lsSet(LS_CLIENTS, CLIENTS); }
function watchClients(){
  if(Store.mode!=='remote'){ loadClientsLocal(); return; }
  if(clientsUnsub) clientsUnsub();
  const col=fdb.collection('clients'); const em=(user.email||'').toLowerCase();
  const q = isBcbaUser() ? col : col.where('members','array-contains',em);
  let firstSnap=true;
  clientsUnsub=q.onSnapshot(s=>{ CLIENTS=s.docs.map(x=>Object.assign({id:x.id},x.data())); if(firstSnap&&!s.metadata.fromCache){ firstSnap=false; if(isBcbaUser()&&!CLIENTS.length){ seedJacob().catch(()=>{}); } } if(CID){ CMETA=CLIENTS.find(c=>c.id===CID)||CMETA; }
    if(!CID && !isBcbaUser()){ const act=CLIENTS.filter(c=>c.active!==false); if(act.length===1){ selectClient(act[0].id); return; } }
    changed(); }, ()=>toast('Couldn\'t load your clients. Ask your BCBA to add your email.'));
}
function selectClient(cid){
  clientUnsubs.forEach(f=>f()); clientUnsubs=[];
  CID=cid||null; S=blankState(); E=[]; FILES=[]; filesLoaded=false; drafts={}; unlocked=false; openEntries.clear(); wrapDone=null; editIdx=-1; schedPanel=''; addOpen=false;
  try{ if(CID) localStorage.setItem(LS_CUR,CID); else localStorage.removeItem(LS_CUR); }catch(e){}
  CMETA = CID ? (CLIENTS.find(c=>c.id===CID)||null) : null;
  if(CID){
    if(Store.mode==='remote'){
      const base=cref();
      clientUnsubs.push(base.onSnapshot(s=>{ if(s.exists){ CMETA=Object.assign({id:s.id},s.data()); changed(); } }, ()=>{}));
      clientUnsubs.push(base.collection('app').doc('state').onSnapshot(s=>{ S=Object.assign(blankState(), s.data()||{}); changed(); }, ()=>toast('Can\'t open this client. Ask your BCBA to add your email.')));
      clientUnsubs.push(base.collection('files').orderBy('t','desc').limit(200).onSnapshot(q=>{ FILES=q.docs.map(x=>Object.assign({id:x.id},x.data())); filesLoaded=true; changed(); }, ()=>{}));
      clientUnsubs.push(base.collection('entries').where('t','>=',histCut()).orderBy('t','desc').limit(800).onSnapshot(q=>{ E=q.docs.map(x=>Object.assign({id:x.id},x.data())); changed(); }, ()=>{}));
    } else { loadLocal(); }
  }
  if(location.hash!=='#home') location.hash='home'; else render();
}
async function boot(){
  clearOldTestData();
  const fromLink=hashClient(); try{ if(fromLink) localStorage.setItem(LS_CUR, fromLink); }catch(e){}
  let start=fromLink; try{ if(!start) start=localStorage.getItem(LS_CUR); }catch(e){}
  if(!CFG){ loadClientsLocal(); if(start&&!CLIENTS.some(c=>c.id===start)) start=null; selectClient(start); return; }
  try{
    const B='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(B+'firebase-app-compat.js');
    await Promise.all([loadScript(B+'firebase-auth-compat.js'), loadScript(B+'firebase-firestore-compat.js')]);
    firebase.initializeApp(CFG);
    fdb=firebase.firestore();
    try{ await fdb.enablePersistence({synchronizeTabs:true}); }catch(e){}
    Store.mode='remote'; authState='checking'; render();
    try{ if(firebase.auth().isSignInWithEmailLink(location.href)){ const em=localStorage.getItem('gp2-signin-email'); if(em) finishEmailLink(em); else { siNeedEmail=true; } } }catch(e){}
    try{ firebase.auth().getRedirectResult().catch(x=>toast(siErrMsg(x))); }catch(e){}
    firebase.auth().onAuthStateChanged(u=>{
      user=u; authState='ready'; unsubs.forEach(f=>f()); unsubs=[]; clientUnsubs.forEach(f=>f()); clientUnsubs=[]; if(clientsUnsub){ clientsUnsub(); clientsUnsub=null; }
      if(u){ me=(u.email||'').split('@')[0]; watchClients(); selectClient(start); }
      else render();
    });
  }catch(e){ Store.mode='local'; loadClientsLocal(); selectClient(null); toast('Couldn\'t reach the database. Saving on this device.'); }
}
boot();
})();

</script>
